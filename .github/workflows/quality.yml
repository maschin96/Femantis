name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend · Node 22
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend · Python ${{ matrix.python-version }}
    needs: frontend
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: npm ci
      - name: Install pinned private Toolbox
        env:
          GH_TOKEN: ${{ secrets.TOOLBOX_READ_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::TOOLBOX_READ_TOKEN fehlt (FEM-Toolbox: Contents read).'
            exit 1
          fi
          npm run setup:backend
      - run: npm run test:backend
      - run: npm test

  desktop:
    name: Desktop · macOS 15
    needs: frontend
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Install pinned private Toolbox
        env:
          GH_TOKEN: ${{ secrets.TOOLBOX_READ_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::TOOLBOX_READ_TOKEN fehlt (FEM-Toolbox: Contents read).'
            exit 1
          fi
          npm run setup:backend
      - run: npm run build
      - run: npm run test:desktop
      - name: Preserve failed desktop diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
