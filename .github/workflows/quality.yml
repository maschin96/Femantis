name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend · Node 22
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend · Python ${{ matrix.python-version }}${{ matrix.os == 'windows-2025' && ' · Windows' || '' }}
    needs: frontend
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ['3.11', '3.12', '3.13']
        include:
          - os: windows-2025
            python-version: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: npm ci
      - name: Install pinned public Toolbox
        run: npm run setup:backend
        env:
          FEMANTIS_SETUP_PYTHON: python
      - name: Verify Python 3.13 constraints
        if: matrix.python-version == '3.13'
        run: node scripts/venv-python.mjs scripts/setup_backend.py --check-constraints
      - run: npm run test:backend
      - run: npm test

  desktop:
    name: Desktop · ${{ matrix.label }}
    needs: frontend
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS 15
          - os: windows-2025
            label: Windows 2025
          - os: ubuntu-24.04
            label: Ubuntu 24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Install pinned public Toolbox
        run: npm run setup:backend
        env:
          FEMANTIS_SETUP_PYTHON: python
      - run: npm run build
      - name: Allow the Chromium sandbox and a virtual display (Linux)
        if: runner.os == 'Linux'
        # Ubuntu 24.04 restricts unprivileged user namespaces, which Electron's sandbox needs.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Desktop tests
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Desktop tests (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run test:desktop
        env:
          # Software OpenGL (Mesa llvmpipe) is blocklisted for WebGL by default.
          FEMANTIS_TEST_CHROMIUM_ARGS: --ignore-gpu-blocklist
      - name: Preserve failed desktop diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package · macOS 15
    needs: frontend
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # No setup-python and no .venv: the package brings its own pinned CPython.
      - run: npm run package:mac
      - run: cat dist/*.build.json dist/SHA256SUMS
      - run: npm run test:package
      - name: Offline smoke test in Seatbelt sandbox
        run: npm run test:package
        env:
          FEMANTIS_PACKAGE_SANDBOX: '1'
      - name: Preserve failed package diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
