<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Femantis app icon: a meshed tetrahedron with a heat-map face on the macOS icon grid. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F8FA"/>
      <stop offset="1" stop-color="#D3E0E6"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2F80ED"/>
      <stop offset="0.5" stop-color="#1FBF6A"/>
      <stop offset="1" stop-color="#F0A838"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#0F2533" stroke-opacity="0.08"/>
  <polygon points="512,230 270,720 640,800" fill="url(#field)"/>
  <polygon points="512,230 640,800 780,610" fill="#109652"/>
  <g fill="none" stroke="#0F2533" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="512,230 270,720 640,800 780,610"/>
    <line x1="512" y1="230" x2="640" y2="800"/>
  </g>
  <g fill="none" stroke="#0F2533" stroke-opacity="0.35" stroke-width="7">
    <line x1="391" y1="475" x2="455" y2="760"/>
    <line x1="391" y1="475" x2="576" y2="515"/>
    <line x1="576" y1="515" x2="455" y2="760"/>
  </g>
  <g fill="#0F2533">
    <circle cx="512" cy="230" r="22"/><circle cx="270" cy="720" r="22"/>
    <circle cx="640" cy="800" r="22"/><circle cx="780" cy="610" r="22"/>
  </g>
</svg>
